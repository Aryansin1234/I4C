  <rect x="6.2" y="8.5" width="1.2" height="15" rx="0.6" fill="#F0F0F2"/>
  <rect x="5" y="21.9" width="3.5" height="1.6" rx="0.8" fill="#F0F0F2"/>
  <!-- 4 — vertical stroke -->
